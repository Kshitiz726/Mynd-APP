<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://js.puter.com/v2/"></script>
<style>
  /* This page is never seen. It is a transparent sheet laid exactly over the
     app's own "Sign in with Puter" button, and the only thing it contributes
     is the tap.

     Puter's signIn() opens a popup, and a popup only survives if a real click
     inside the WebView granted user activation first - calling signIn() from
     injected JS is silently blocked. So the button has to live in the page.
     Nothing says it has to be visible. The app draws the button; this catches
     the finger. That is what removes the second screen: there is no longer a
     web page telling you to sign in to Puter after you already said you would. */
  html,body{height:100%;margin:0;background:transparent}
  button{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;
    border:none;background:transparent;-webkit-tap-highlight-color:transparent;
    cursor:pointer;font:inherit;color:transparent}
</style></head>
<body>
  <button id="btn" aria-label="Sign in with Puter"></button>
<script>
  function flh(n,d){ try{ window.flutter_inappwebview.callHandler(n,d); }catch(e){} }
  function authed(){ try{ return !!(window.puter && puter.auth && puter.auth.isSignedIn && puter.auth.isSignedIn()); }catch(e){ return false; } }
  function token(){ try{ return (window.puter && puter.authToken) ? puter.authToken : ''; }catch(e){ return ''; } }
  window.addEventListener('load', function(){
    try{ puter.quiet = true; }catch(e){}
    flh('onReady', {});
    if (authed()) flh('onConnected', { ok: true, token: token() });
  });
  document.getElementById('btn').addEventListener('click', async function(){
    flh('onOpening', {});
    try {
      await puter.auth.signIn();
      flh('onConnected', { ok: authed(), token: token() });
    } catch(e){
      flh('onConnected', { ok: false, error: String(e && (e.message || e)) });
    }
  });
</script></body></html>
