name: ourmynd
description: "OurMynd — an ADHD-focused productivity, wellness & community app."
publish_to: "none"
version: 1.0.0+15

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (per spec).
  provider: ^6.1.2

  # Typography — Fredoka (display), Lexend (body), Atkinson Hyperlegible
  # (accessibility) are all served from Google Fonts, so we don't bundle
  # font binaries.
  google_fonts: ^6.2.1

  # Groq API — HTTP client for streaming SSE chat completions + REST backend.
  http: ^1.2.2

  # Embedded WebView (Android/iOS/macOS/Windows) — hosts Puter.js so the coach's
  # AI chat + text-to-speech run inside the native app via a JS bridge.
  flutter_inappwebview: ^6.1.5

  # The runtime microphone grant. RECORD_AUDIO is declared in the manifest, but
  # on API 23+ (our floor) a declared dangerous permission means nothing until
  # the user grants it, and nobody was ever asking: the WebView's
  # onPermissionRequest answers the *web* layer only, so getUserMedia failed on
  # every real phone and voice input just said "didn't catch that".
  permission_handler: ^11.3.1

  # Profile pictures: pick from the gallery or take one, then shrink it before
  # it ever leaves the phone. image_picker's own maxWidth/imageQuality does the
  # resizing natively, so a 12MP camera photo arrives as a ~50KB square rather
  # than something the server has to reject.
  image_picker: ^1.1.2


  # Cross-session memory — stores conversation summary between app launches.
  shared_preferences: ^2.3.2

  # Real OS notifications for reminders and alarms. The old service was an
  # in-process Timer that played a sound, so nothing fired unless the app was
  # already open and on screen, which is the one moment you do not need
  # reminding. timezone is required by the plugin's zonedSchedule.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  lucide_icons_flutter: ^3.1.14+2

  # Realtime backend — Socket.IO client for the Community feed + Focus Rooms
  # (presence, timer sync, chat) and LiveKit for body-doubling voice channels.
  socket_io_client: ^2.0.3+1
  livekit_client: ^2.3.0
  audioplayers: ^6.1.0

  # Real Google OAuth sign-in (web uses Google Identity Services under the hood;
  # client id is set via the meta tag in web/index.html).
  google_sign_in: ^6.2.1

  # Sign in with Apple. App Store review requires this wherever a third-party
  # sign-in is offered, and the button has been on the login screen (inert)
  # since before there was anything behind it.
  sign_in_with_apple: ^6.1.3

  # Desktop (Windows/Linux) real Google OAuth: the loopback "installed app" flow
  # opens the system browser (url_launcher) and uses PKCE (crypto) — google_sign_in
  # has no desktop implementation.
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.9
  video_player: ^2.11.1
  flutter_secure_storage: ^11.0.0
  file_picker: ^12.1.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  device_calendar: ^4.3.3
  mailer: ^7.2.0
  # Reading the inbox. An app password authenticates SMTP and IMAP both, so
  # this is what lets the coach summarise mail without Google having to verify
  # and annually re-assess the app for a restricted API scope.
  enough_mail: ^2.1.6

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  # Drives the real app on a real device against the real server. The widget
  # tests above prove a screen is wired up; this is the only thing that proves
  # a screen actually loads once a live session and a live backend are in front
  # of it. Dev-only, so nothing here reaches a release binary.
  integration_test:
    sdk: flutter

  # Generates platform app icons (iOS/Android/web/macOS) from a single source
  # PNG — pure Dart, so it runs on Windows. See `flutter_launcher_icons:` below.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/puter/
    # The agent faces. Shipped rather than fetched: the avatar is on screen
    # before anything else has loaded, and a coach with a missing face is worse
    # than a coach with a plain one.
    - assets/agents/
    - assets/soul/
    - assets/sfx/
    # The app icon, bundled so the splash and login screens can show the same
    # mark the user tapped. flutter_launcher_icons only reads it at build time;
    # displaying it inside the app needs it shipped as well.
    - assets/branding/app_icon.png

  # The orb is generated on the GPU rather than decoded from a video, which is
  # why there is no longer an assets/video/ directory: fluid.mp4 and the still
  # frame extracted from it are gone. See lib/widgets/fluid_orb.dart.
  shaders:
    - shaders/fluid_orb.frag

# App-icon generation from the OurMynd logo.
# Run: dart run flutter_launcher_icons
# iOS forbids alpha in app icons (App Store rejects them), so the two settings
# below flatten it onto white.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
