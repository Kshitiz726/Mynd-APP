# OurMynd backend on Fly.io.
#
# One-time:  fly launch --no-deploy   (or: fly apps create ourmynd-server)
# then set secrets (see DEPLOY.md), then:  fly deploy
#
# The app name must be globally unique — change it here if "ourmynd-server" is
# taken, or let `fly launch` pick one and rewrite this line.
app = "ourmynd-server"
primary_region = "lhr"   # London — closest to a UK user base. Change if needed.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # min_machines_running = 1 keeps the realtime socket server always awake (no
  # cold-start dropping presence/timers). Set to 0 to let it stop when idle and
  # save free-tier hours, at the cost of a wake delay on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [[http_service.checks.http]]
      method = "GET"
      path = "/health"
      interval = "15s"
      timeout = "2s"
      grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
